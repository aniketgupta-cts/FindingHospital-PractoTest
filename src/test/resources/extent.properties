# Extent Reports - Cucumber7 Adapter config
# Place this file at: src/test/resources/extent.properties

extent.reporter.spark.start=true
extent.reporter.spark.out=reports/SparkReport.html

extent.reporter.spark.config.theme=dark
extent.reporter.spark.config.documentTitle=Practo Hackathon Report
extent.reporter.spark.config.reportName=BDD Automation Report
extent.reporter.spark.config.timeStampFormat=MMM dd, yyyy HH:mm:ss